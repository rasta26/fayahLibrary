name: skill-security-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the scan job widens only what SARIF upload needs.
permissions:
  contents: read

# Cancel superseded runs when new commits are pushed to the same ref.
concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.x"
  RESULTS_DIR: skillspector-results

jobs:
  check:
    name: Structural checks + gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Structural checks
        run: make check
      - name: SkillSpector gate contract tests
        run: make test

  scan:
    name: SkillSpector scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      actions: read          # required by upload-sarif on private repos
    env:
      # Optional LLM pass: add an ANTHROPIC_API_KEY repo secret to enable it.
      # Without it the gate runs static analysis only (--no-llm).
      SKILLSPECTOR_PROVIDER: ${{ secrets.ANTHROPIC_API_KEY != '' && 'anthropic' || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        # Pinned to a full commit SHA (third-party action); comment tracks the tag.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install SkillSpector (pinned Git release)
        run: |
          scripts/skillspector-scan install
          skillspector --version

      - name: Scan (SARIF)
        id: scan
        run: |
          rc=0
          scripts/skillspector-scan --format sarif --out "$RESULTS_DIR" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always() && steps.scan.outcome == 'success'
        run: |
          scripts/skillspector-scan --format markdown --out "$RESULTS_DIR" || true
          for f in "$RESULTS_DIR"/*.md; do
            [ -f "$f" ] || continue
            { echo "## SkillSpector: $(basename "$f" .md)"; cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done

      # Fork PRs get a read-only token, so code-scanning upload is skipped there;
      # the reports are still attached as an artifact below.
      - name: Upload SARIF (skills)
        if: always() && hashFiles('skillspector-results/skills.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.RESULTS_DIR }}/skills.sarif
          category: skillspector-skills
      - name: Upload SARIF (plugin)
        if: always() && hashFiles('skillspector-results/plugin.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.RESULTS_DIR }}/plugin.sarif
          category: skillspector-plugin
      - name: Upload SARIF (mcp)
        if: always() && hashFiles('skillspector-results/mcp.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.RESULTS_DIR }}/mcp.sarif
          category: skillspector-mcp

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillspector-report
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: ignore

      - name: Enforce gate
        if: steps.scan.outputs.rc != '0'
        run: |
          echo "::error::SkillSpector gate failed (exit ${{ steps.scan.outputs.rc }}): 1 = findings or incomplete coverage, 2 = scanner error. Fix, or accept known findings in .skillspector-baseline.yaml."
          exit 1
